/* weight suggestion: weeks 1–2 = start, weeks 3–4 add increment */
const weekKg = (ex, week) => {
  const steps = Math.max(0, week - 2);
  const v = ex.startKg + ex.incKg * steps;
  return Math.round(v * 2) / 2;
};

/* ---------- tiny bumper-plate checkbox ---------- */
function Plate({ done, color, onClick, label }) {
  return (
    <button
      onClick={onClick}
      aria-label={label}
      style={{
        width: 34, height: 34, borderRadius: "50%",
        border: `3px solid ${done ? color : T.line}`,
        background: done ? color : T.chalk,
        display: "flex", alignItems: "center", justifyContent: "center",
        cursor: "pointer", transition: "all .15s ease", padding: 0,
      }}
    >
      <span style={{
        width: 10, height: 10, borderRadius: "50%",
        background: done ? T.chalk : T.line,
      }} />
    </button>
  );
}

  if (n.includes("Incline Dumbbell Press")) return "chestpress";
  if (n.includes("Lat Pulldown")) return "pulldown";
  if (n.includes("Chest Press")) return "chestpress";
  if (n.includes("Leg Press")) return "legpress";
  if (n.includes("Shoulder Press")) return "press";
  if (n.includes("Lateral Raise")) return "lateral";
  if (n.includes("Face Pull")) return "facepull";
  if (n.includes("Pushdown")) return "pushdown";
  if (n.includes("Overhead")) return "overhead";
  if (n.includes("Row")) return "row";
  if (n.includes("Pec-Deck")) return "reversefly";
  if (n.includes("Curl")) return "curl";
  if (n.includes("Carry")) return "carry";
  if (n.includes("Dip")) return "dip";
  if (n.includes("Squat")) return "squat";
  if (n.includes("Plank")) return "plank";
  return "press";
};

        <><circle cx="52" cy="22" r="7" {...P} /><path d="M52 29 V58 M52 58 V72 M52 72 V84 M52 84 H62" {...P} /><path d="M52 36 L60 40" {...M} />{D(62, 41)}</>,
        <><circle cx="44" cy="40" r="7" {...P} /><path d="M46 47 L58 66 M58 66 L46 76 L50 86 M50 86 H62" {...P} /><path d="M48 52 L58 56" {...M} />{D(60, 57)}</>
      );
    case "fly":
      return wrap(
        <><circle cx="60" cy="24" r="7" {...P} /><path d="M60 31 V64 M60 64 L52 86 M60 64 L68 86" {...P} /></>,
        <><path d="M60 38 L30 36 M60 38 L90 36" {...M} />{D(28, 36)}{D(92, 36)}</>,
        <><path d="M60 38 L52 54 M60 38 L68 54" {...M} />{D(54, 56)}{D(66, 56)}</>
      );
    case "shrug":
      return wrap(
        <><circle cx="60" cy="20" r="7" {...P} /><path d="M60 27 V62 M60 62 L52 86 M60 62 L68 86" {...P} /></>,
        <><path d="M52 34 H68 M60 34 L54 64 M60 34 L66 64" {...M} />{D(54, 68)}{D(66, 68)}</>,
        <><path d="M52 30 H68 M60 30 L54 59 M60 30 L66 59" {...M} />{D(54, 63)}{D(66, 63)}<path d="M84 54 V40 M80 45 L84 39 L88 45" {...M} strokeWidth={2} /></>
      );
    case "crunch":
      return wrap(
        <><path d="M14 84 H106" {...P} strokeWidth={2} /><path d="M64 80 L76 62 L90 80" {...P} /></>,
        <><circle cx="26" cy="74" r="6" {...P} /><path d="M32 77 L64 80" {...M} /></>,
        <><circle cx="36" cy="60" r="6" {...P} /><path d="M40 65 Q52 70 64 80" {...M} /></>
      );
    case "armcircle":
      return wrap(
        <><circle cx="60" cy="20" r="7" {...P} /><path d="M60 27 V60 M60 60 L52 84 M60 60 L68 84" {...P} /><path d="M96 40 A11 11 0 1 1 98 26 M94 22 L99 27 L92 30" {...M} strokeWidth={2} /></>,
        <path d="M60 34 L34 34 M60 34 L86 34" {...M} />,
        <path d="M60 34 L40 16 M60 34 L80 16" {...M} />
      );
    case "pullapart":
      return wrap(
        <><circle cx="60" cy="20" r="7" {...P} /><path d="M60 27 V60 M60 60 L52 84 M60 60 L68 84" {...P} /></>,
        <><path d="M60 36 L50 48 M60 36 L70 48" {...M} /><path d="M50 48 H70" {...P} strokeWidth={2} />{D(50, 48)}{D(70, 48)}</>,
        <><path d="M60 36 L30 40 M60 36 L90 40" {...M} /><path d="M30 40 L90 40" {...P} strokeWidth={2} />{D(30, 40)}{D(90, 40)}</>
      );
    case "extrot":
      return wrap(
        <><rect x="8" y="44" width="6" height="16" fill={T.ink} /><circle cx="52" cy="20" r="7" {...P} /><path d="M52 27 V60 M52 60 L44 84 M52 60 L60 84" {...P} /><path d="M52 36 L52 54" {...P} /></>,
        <><path d="M52 54 L36 50" {...M} />{D(34, 50)}<path d="M34 50 L14 50" {...P} strokeWidth={2} /></>,
        <><path d="M52 54 L70 48" {...M} />{D(72, 48)}<path d="M72 48 C 50 62, 30 58, 14 50" {...P} strokeWidth={2} /></>
      );
    case "crossbody":
      return wrap(
        <><circle cx="60" cy="20" r="7" {...P} /><path d="M60 27 V60 M60 60 L52 84 M60 60 L68 84" {...P} /><path d="M66 34 L38 44" {...M} /><circle cx="36" cy="44" r="3.5" fill={T.ink} stroke="none" /><path d="M52 36 L58 42" {...P} /></>,
        null, null
      );
    case "doorway":
      return wrap(
        <><path d="M84 16 V90" {...P} /><circle cx="48" cy="26" r="7" {...P} /><path d="M50 33 L58 62 M58 62 L50 86 M58 62 L68 84" {...P} /><path d="M54 38 L76 34 L80 20" {...M} />{D(80, 18)}</>,
        null, null
      );
    case "tristretch":
      return wrap(
        <><circle cx="60" cy="24" r="7" {...P} /><path d="M60 31 V64 M60 64 L52 86 M60 64 L68 86" {...P} /><path d="M66 36 L70 14 L52 12" {...M} />{D(50, 12)}<path d="M52 34 L68 16" {...P} /></>,
        null, null
      );
    case "plank":
      return wrap(
        <><path d="M16 82 H104" {...P} strokeWidth={2} /><circle cx="28" cy="58" r="6" {...P} /><path d="M34 62 L90 76 M34 62 L30 76 M24 78 H40 M90 76 L96 82" {...P} /></>,
        null, null
      );
    default:
      return null;
  }
}

function App() {
  const [week, setWeek] = useState(1);
  const [dayIdx, setDayIdx] = useState(0);
  const [done, setDone] = useState({});           // key: `${week}-${day}-${ex}-${set}`
  const [checks, setChecks] = useState({});       // warm-up / cool-down items
  const [open, setOpen] = useState({});           // expanded exercise cards

  const day = DAYS[dayIdx];
  const c = day.color;

  const toggleSet = (ei, si) => {
    const k = `${week}-${day.id}-${ei}-${si}`;
    setDone((d) => ({ ...d, [k]: !d[k] }));
  };

  const totalSets = day.exercises.reduce((a, e) => a + e.sets, 0);
  const doneSets = day.exercises.reduce((a, e, ei) => {
    let n = 0;
    for (let s = 0; s < e.sets; s++) if (done[`${week}-${day.id}-${ei}-${s}`]) n++;
    return a + n;
  }, 0);

  return (
    <div style={{ minHeight: "100vh", background: T.bg, color: T.ink, fontFamily: "'Inter', -apple-system, system-ui, sans-serif", paddingBottom: 24 }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap');
        button:focus-visible { outline: 3px solid ${T.ink}; outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
        .mv .pA { animation: mvA 2.4s ease-in-out infinite; }
        .mv .pB { animation: mvB 2.4s ease-in-out infinite; }
        @keyframes mvA { 0%,38% {opacity:1} 50%,88% {opacity:.16} 100% {opacity:1} }
        @keyframes mvB { 0%,38% {opacity:.16} 50%,88% {opacity:1} 100% {opacity:.16} }
        @media (prefers-reduced-motion: reduce) { .mv .pA { animation: none; opacity: .25; } .mv .pB { animation: none; opacity: 1; } }
      `}</style>

      {/* header */}
      <div style={{ padding: "20px 16px 12px", maxWidth: 560, margin: "0 auto" }}>
        <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700, fontSize: 32, letterSpacing: 1, textTransform: "uppercase", lineHeight: 1 }}>
          Shoulder-First
        </div>
        <div style={{ fontSize: 13, color: T.sub, marginTop: 4 }}>
          4 weeks · 3 days/week · ~60 min · built around your right-shoulder comeback
        </div>

        {/* week selector */}
        <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
          {[1, 2, 3, 4].map((w) => (
            <button key={w} onClick={() => setWeek(w)}
              style={{
                flex: 1, padding: "8px 0", borderRadius: 8,
                border: `2px solid ${week === w ? T.ink : T.line}`,
                background: week === w ? T.ink : T.chalk,
                color: week === w ? T.chalk : T.ink,
                fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700, fontSize: 16,
                cursor: "pointer",
              }}>
              WK {w}
            </button>
          ))}
        </div>
        <div style={{ fontSize: 12.5, color: T.sub, marginTop: 8, lineHeight: 1.45 }}>{WEEK_NOTES[week - 1]}</div>

        {/* day tabs */}
        <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
          {DAYS.map((d, i) => (
            <button key={d.id} onClick={() => setDayIdx(i)}
              style={{
                flex: 1, padding: "10px 4px", borderRadius: 10, cursor: "pointer",
                border: `2px solid ${i === dayIdx ? d.color : T.line}`,
                background: i === dayIdx ? d.color : T.chalk,
                color: i === dayIdx ? T.chalk : T.ink,
              }}>
              <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700, fontSize: 17, lineHeight: 1 }}>{d.label}</div>
              <div style={{ fontSize: 10.5, marginTop: 3, opacity: 0.9 }}>{d.name}</div>
            </button>
          ))}
        </div>
      </div>

      {/* day body */}
      <div style={{ maxWidth: 560, margin: "0 auto", padding: "0 16px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", margin: "6px 2px 10px" }}>
          <div style={{ fontSize: 13, color: T.sub }}>{day.focus} · {day.schedule}</div>
          <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700, fontSize: 16, color: c }}>
            {doneSets}/{totalSets} sets
          </div>
        </div>

        {/* today's lineup — prep before you go */}
        <div style={{ background: T.ink, color: T.chalk, borderRadius: 14, padding: 14, marginBottom: 12 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
            <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700, fontSize: 17, textTransform: "uppercase", letterSpacing: 0.6 }}>
              Today's lineup
            </div>
            <div style={{ fontSize: 11, opacity: 0.7 }}>read this BEFORE you leave home</div>
          </div>
          <div style={{ marginTop: 10 }}>
            {day.exercises.map((ex, ei) => {
              const kg = weekKg(ex, week);
              const spot = ex.machine.replace("Look for: ", "").split(" (")[0];
              return (
                <div key={ei} style={{ display: "flex", gap: 10, alignItems: "baseline", padding: "5px 0", borderBottom: ei < day.exercises.length - 1 ? "1px solid rgba(255,255,255,.12)" : "none" }}>
                  <span style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700, fontSize: 16, color: c, minWidth: 18 }}>{ei + 1}</span>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 13.5, fontWeight: 600 }}>{ex.name}</div>
                    <div style={{ fontSize: 11.5, opacity: 0.7 }}>{spot}</div>
                  </div>
                  <div style={{ fontSize: 12, whiteSpace: "nowrap", textAlign: "right" }}>
                    {ex.sets}×{ex.reps}
                    {ex.startKg > 0 && <div style={{ opacity: 0.8 }}>{kg} kg{ex.perHand ? "/hand" : ""}{ex.incKg < 0 ? " assist" : ""}</div>}
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{ marginTop: 10, fontSize: 12, lineHeight: 1.6, opacity: 0.85, borderTop: "1px solid rgba(255,255,255,.12)", paddingTop: 8 }}>
            <b>Watch at home (~6 min), not at the gym</b> — YouTube each phrase, one video is enough:{" "}
            {[...new Set(day.exercises.map((e) => e.yt))].map((y, i, arr) => (
              <span key={y}>“{y}”{i < arr.length - 1 ? " · " : ""}</span>
            ))}
          </div>
        </div>

        {/* warm-up */}
        <Section title="Warm-up · 8 min" color={c}>
          {WARMUP.map((w, i) => (
            <div key={i}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <div style={{ flex: 1 }}>
                  <CheckLine text={w.text} color={c}
                    done={!!checks[`${week}-${day.id}-wu-${i}`]}
                    onClick={() => setChecks((ch) => ({ ...ch, [`${week}-${day.id}-wu-${i}`]: !ch[`${week}-${day.id}-wu-${i}`] }))} />
                </div>
                {w.icon && (
                  <button onClick={() => setOpen((o) => ({ ...o, ["wu-" + i]: !o["wu-" + i] }))}
                    style={{ border: `1.5px solid ${T.line}`, background: T.chalk, borderRadius: 8, padding: "3px 9px", fontSize: 11.5, cursor: "pointer", color: T.ink, fontWeight: 600, flexShrink: 0 }}>
                    {open["wu-" + i] ? "Hide" : "How?"}
                  </button>
                )}
              </div>
              {w.icon && open["wu-" + i] && (
                <div style={{ display: "flex", gap: 10, alignItems: "center", background: T.bg, borderRadius: 10, padding: "6px 10px", margin: "2px 0 8px 28px" }}>
                  <MoveIcon type={w.icon} color={c} />
                  <div style={{ fontSize: 12.5, lineHeight: 1.45 }}>
                    {w.desc}
                    <div style={{ fontSize: 11, color: T.sub, marginTop: 4 }}>{w.hold ? "hold this position" : "faded = start · solid = finish"}</div>
                  </div>
                </div>
              )}
            </div>
          ))}
          <div style={{ fontSize: 12, color: T.sub, marginTop: 6 }}>
            Right shoulder rule: dull burn is fine, sharp pain = stop the set.
          </div>
        </Section>

        {/* exercises */}
        {day.exercises.map((ex, ei) => {
          const kg = weekKg(ex, week);
          const isAssist = ex.incKg < 0;
          const key = `${day.id}-${ei}`;
          const expanded = !!open[key];
          return (
            <div key={ei} style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 14, padding: 14, marginBottom: 12 }}>
              <div style={{ display: "flex", justifyContent: "space-between", gap: 10 }}>
                <div>
                  <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700, fontSize: 19, textTransform: "uppercase", letterSpacing: 0.4, lineHeight: 1.1 }}>
                    {ex.name}
                  </div>
                  <div style={{ fontSize: 13, color: T.sub, marginTop: 3 }}>
                    {ex.sets} × {ex.reps}
                    {ex.startKg > 0 && (
                      <> · <b style={{ color: T.ink }}>{kg} kg / {lb(kg)} lb{ex.perHand ? " per hand" : ""}{isAssist ? " assist" : ""}</b></>
                    )}
                  </div>
                </div>
                <button onClick={() => setOpen((o) => ({ ...o, [key]: !expanded }))}
                  style={{ alignSelf: "flex-start", border: `1.5px solid ${T.line}`, background: T.chalk, borderRadius: 8, padding: "4px 10px", fontSize: 12, cursor: "pointer", color: T.ink, fontWeight: 600 }}>
                  {expanded ? "Hide" : "How?"}
                </button>
              </div>

              {expanded && (
                <div style={{ marginTop: 10, fontSize: 13.5, lineHeight: 1.5, borderTop: `1px dashed ${T.line}`, paddingTop: 10 }}>
                  <div style={{ display: "flex", justifyContent: "center", marginBottom: 6 }}>
                    <div style={{ textAlign: "center", background: T.bg, borderRadius: 10, padding: "6px 14px 2px" }}>
                      <MoveIcon type={iconFor(ex.name)} color={c} />
                      <div style={{ fontSize: 11, color: T.sub, paddingBottom: 4 }}>faded = start · solid = finish</div>
                    </div>
                  </div>
                  <div>{ex.desc}</div>
                  <div style={{ marginTop: 6, color: T.sub }}>{ex.machine}</div>
                  <div style={{ color: T.sub }}>{ex.alt}</div>
                  <div style={{ marginTop: 6 }}>
                    <span style={{ background: T.bg, border: `1px solid ${T.line}`, borderRadius: 6, padding: "2px 8px", fontSize: 12 }}>
                      ▶ YouTube: “{ex.yt}”
                    </span>
                  </div>
                  <div style={{ marginTop: 8, fontSize: 12.5, color: c, fontWeight: 600 }}>{ex.note}</div>
                  <div style={{ marginTop: 4, fontSize: 12, color: T.sub }}>
                    Self-test: last 2 reps hard, form clean. Too easy → {isAssist ? "lower the assist" : "add weight"} next session; form breaks → go lighter.
                  </div>
                </div>
              )}

              {/* set plates */}
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 12 }}>
                <div style={{ height: 5, flexShrink: 0, width: 18, background: T.line, borderRadius: 3 }} />
                {Array.from({ length: ex.sets }).map((_, si) => (
                  <Plate key={si} color={c}
                    done={!!done[`${week}-${day.id}-${ei}-${si}`]}
                    onClick={() => toggleSet(ei, si)}
                    label={`${ex.name} set ${si + 1}`} />
                ))}
                <div style={{ height: 5, flex: 1, background: T.line, borderRadius: 3 }} />
                <span style={{ fontSize: 11, color: T.sub, whiteSpace: "nowrap" }}>tap = set done</span>
              </div>
            </div>
          );
        })}

        {/* cool-down */}
        <Section title="Cool-down · 4 min" color={c}>
          {COOLDOWN.map((w, i) => (
            <div key={i}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <div style={{ flex: 1 }}>
                  <CheckLine text={w.text} color={c}
                    done={!!checks[`${week}-${day.id}-cd-${i}`]}
                    onClick={() => setChecks((ch) => ({ ...ch, [`${week}-${day.id}-cd-${i}`]: !ch[`${week}-${day.id}-cd-${i}`] }))} />
                </div>
                {w.icon && (
                  <button onClick={() => setOpen((o) => ({ ...o, ["cd-" + i]: !o["cd-" + i] }))}
                    style={{ border: `1.5px solid ${T.line}`, background: T.chalk, borderRadius: 8, padding: "3px 9px", fontSize: 11.5, cursor: "pointer", color: T.ink, fontWeight: 600, flexShrink: 0 }}>
                    {open["cd-" + i] ? "Hide" : "How?"}
                  </button>
                )}
              </div>
              {w.icon && open["cd-" + i] && (
                <div style={{ display: "flex", gap: 10, alignItems: "center", background: T.bg, borderRadius: 10, padding: "6px 10px", margin: "2px 0 8px 28px" }}>
                  <MoveIcon type={w.icon} color={c} />
                  <div style={{ fontSize: 12.5, lineHeight: 1.45 }}>
                    {w.desc}
                    <div style={{ fontSize: 11, color: T.sub, marginTop: 4 }}>{w.hold ? "hold this position" : "faded = start · solid = finish"}</div>
                  </div>
                </div>
              )}
            </div>
          ))}
        </Section>

        {/* nutrition card */}
        <Section title="Daily fuel · lean bulk (meds-adjusted)" color={c}>
          <div style={{ fontSize: 13.5, lineHeight: 1.6 }}>
            <b>~3,000 kcal · 180 g protein</b> (you: 100 kg) · 130 g food + 2 scoops (50 g).<br />
            <b>8:30</b> meds + big glass of water<br />
            <b>9:30–10</b> Shake #1: scoop + banana (or blend with milk + 40 g oats)<br />
            <b>10:30–11:30</b> train<br />
            <b>~12:00</b> Shake #2 within 60 min + real food if you can (rice + chicken)<br />
            <b>15:30 alarm</b> no-effort snack — don't wait to feel hungry<br />
            <b>Evening</b> appetite is back: BIG dinner — most calories live here<br />
            <b>Bed</b> Greek yogurt or cottage cheese (~20 g)<br />
            <b>Rest day:</b> same times, same protein — shakes with breakfast + afternoon.<br />
            Can't-eat day rescue: 3rd scoop is fine.
          </div>
        </Section>
      </div>
    </div>
  );
}

function Section({ title, color, children }) {
  return (
    <div style={{ background: T.card, border: `1px solid ${T.line}`, borderLeft: `4px solid ${color}`, borderRadius: 14, padding: 14, marginBottom: 12 }}>
      <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700, fontSize: 16, textTransform: "uppercase", letterSpacing: 0.6, marginBottom: 8 }}>
        {title}
      </div>
      {children}
    </div>
  );
}

function CheckLine({ text, done, onClick, color }) {
  return (
    <button onClick={onClick}
      style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", background: "transparent", border: "none", padding: "5px 0", cursor: "pointer", textAlign: "left" }}>
      <span style={{
        width: 18, height: 18, borderRadius: 5, flexShrink: 0,
        border: `2px solid ${done ? color : T.line}`,
        background: done ? color : T.chalk,
        display: "inline-flex", alignItems: "center", justifyContent: "center",
        color: T.chalk, fontSize: 12, fontWeight: 700,
      }}>{done ? "✓" : ""}</span>
      <span style={{ fontSize: 13.5, color: done ? T.sub : T.ink, textDecoration: done ? "line-through" : "none" }}>{text}</span>
    </button>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
